services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: corte
      MYSQL_USER: corte
      MYSQL_PASSWORD: corte
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/corte
      DB_USERNAME: corte
      DB_PASSWORD: corte
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      JUDGE0_URL: http://judge0-server:2358
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      judge0-server:
        condition: service_started

  # Judge0 API에는 인증이 없으므로 ports를 열지 않고 compose 내부망에서만 쓴다
  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: judge0
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    depends_on: &judge0-depends
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    environment: *judge0-env
    depends_on: *judge0-depends

  judge0-db:
    image: postgres:16
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "judge0", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "judge0", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  judge0-db-data:
