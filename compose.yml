services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: corte
      MYSQL_USER: corte
      MYSQL_PASSWORD: corte
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/corte
      DB_USERNAME: corte
      DB_PASSWORD: corte
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
