spring:
  application:
    name: Corte-BE
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/corte}
    username: ${DB_USERNAME:corte}
    password: ${DB_PASSWORD:corte}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  cloud:
    # Spring Cloud 2025.1.x는 Boot 4.0 대상이라 Boot 4.1에서 호환성 검사를 끈다
    compatibility-verifier:
      enabled: false
    openfeign:
      client:
        config:
          judge0:
            connect-timeout: ${JUDGE0_REQUEST_TIMEOUT_MS:5000}
            read-timeout: ${JUDGE0_REQUEST_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  override-with-generic-response: false

github:
  app:
    client-id: ${GITHUB_APP_CLIENT_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}

judge0:
  url: ${JUDGE0_URL:http://localhost:2358}
  poll-interval: ${JUDGE0_POLL_INTERVAL:1s}
  idle-timeout: ${JUDGE0_IDLE_TIMEOUT:2m}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:30m}

admin:
  emails: ${ADMIN_EMAILS:}
